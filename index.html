<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Photo Board</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f0f0f;--surface:#1c1c1c;--border:#2a2a2a;--accent:#2563eb;--accent2:#3b82f6;--text:#e8e8e8;--muted:#888;--radius:6px;--rh:220px;--gap:4px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* HEADER */
header{position:sticky;top:0;z-index:200;background:rgba(15,15,15,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:8px 14px;display:flex;flex-direction:column;gap:6px}
.hrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:7px;border:none;cursor:pointer;font-size:12px;font-weight:500;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent2)}
.btn-ghost{background:var(--surface);color:var(--text);border:1px solid var(--border)}.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-ghost.on{border-color:var(--accent);color:var(--accent);background:rgba(37,99,235,.12)}
.btn-danger{background:#3a1a1a;color:#f77;border:1px solid #5a2a2a}.btn-danger:hover{background:#4a2020}
.hdivider{width:1px;height:18px;background:var(--border);flex-shrink:0}
.search-box{position:relative;flex:1;min-width:110px;max-width:200px}
.search-box input{width:100%;padding:6px 10px 6px 27px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;outline:none;transition:border-color .15s}
.search-box input:focus{border-color:var(--accent)}
.search-box svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
select.sel{padding:6px 9px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;cursor:pointer;outline:none}
select.sel:focus{border-color:var(--accent)}
.slider-wrap{display:flex;align-items:center;gap:5px;color:var(--muted)}
input[type=range]{-webkit-appearance:none;appearance:none;width:75px;height:3px;border-radius:2px;background:var(--border);cursor:pointer;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent);cursor:pointer}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--accent);cursor:pointer;border:none}
.count{font-size:11px;color:var(--muted);white-space:nowrap}

/* TAG FILTER BAR */
#tag-bar{display:none;padding:5px 14px;gap:6px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--border);margin:0 -14px;background:var(--bg)}
#tag-bar.visible{display:flex}
.tag-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:12px;font-size:11px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--muted);transition:all .15s}
.tag-chip:hover{border-color:var(--accent);color:var(--accent)}
.tag-chip.on{border-color:var(--accent);color:var(--accent);background:rgba(37,99,235,.12)}
.tag-chip .tx{cursor:pointer;opacity:.5;margin-left:2px}.tag-chip .tx:hover{opacity:1}
#tag-bar-label{font-size:11px;color:var(--muted)}

/* LOAD PROGRESS */
#load-bar-wrap{position:fixed;top:0;left:0;right:0;height:3px;z-index:9000;display:none;pointer-events:none}
#load-bar{height:100%;width:0%;background:var(--accent);transition:width .1s linear}
#load-label{position:fixed;top:6px;right:14px;font-size:11px;color:var(--accent);background:rgba(15,15,15,.85);padding:2px 8px;border-radius:10px;z-index:9001;display:none;pointer-events:none}

/* GALLERY TABS */
#gallery-tabs{display:none;background:var(--surface);border-top:1px solid var(--border);margin:0 -14px;padding:0 14px;overflow-x:auto;white-space:nowrap;scrollbar-width:thin}
#gallery-tabs::-webkit-scrollbar{height:3px}
#gallery-tabs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.gtab{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;font-size:12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);transition:all .15s;user-select:none}
.gtab:hover{color:var(--text)}.gtab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.gtab .tc{font-size:10px;background:var(--border);border-radius:8px;padding:1px 6px;color:var(--muted)}
.gtab.active .tc{background:rgba(37,99,235,.2);color:var(--accent)}

/* TIMELINE */
#timeline{display:none;overflow-x:auto;white-space:nowrap;padding:8px 14px;background:var(--bg);border-top:1px solid var(--border);margin:0 -14px;scrollbar-width:thin;gap:3px;align-items:center}
#timeline.visible{display:flex}
.tl-month{display:inline-flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 8px;border-radius:6px;transition:background .15s;flex-shrink:0}
.tl-month:hover{background:var(--surface)}
.tl-month.active{background:rgba(37,99,235,.15);outline:1px solid var(--accent)}
.tl-label{font-size:10px;color:var(--muted);white-space:nowrap}
.tl-bar{height:28px;min-width:8px;border-radius:3px;background:var(--accent);opacity:.5;transition:opacity .15s}
.tl-month:hover .tl-bar,.tl-month.active .tl-bar{opacity:1}
.tl-cnt{font-size:9px;color:var(--muted)}

/* SELECTION BAR */
#sel-bar{display:none;background:#0f1b35;border-bottom:1px solid var(--accent);padding:7px 14px;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}
#sel-bar.visible{display:flex}
#sel-count{font-weight:600;color:var(--accent);margin-right:4px}

/* EMPTY */
#empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 80px);gap:12px;text-align:center;padding:40px}
#empty .icon{font-size:52px;opacity:.2}
#empty h2{font-size:20px;font-weight:600}
#empty p{color:var(--muted);font-size:13px;max-width:340px;line-height:1.6}

/* GALLERY */
#gallery{display:flex;flex-wrap:wrap;gap:var(--gap);padding:var(--gap)}
#gallery::after{content:'';flex-grow:999999999;height:0}
.date-divider{width:100%;padding:10px 6px 4px;font-size:12px;font-weight:600;color:var(--muted);flex-basis:100%}

/* CARD */
.photo-card{position:relative;overflow:hidden;border-radius:var(--radius);background:var(--surface);height:var(--rh);cursor:pointer;transition:box-shadow .15s}
.photo-card img{position:absolute;top:50%;left:50%;object-fit:cover;opacity:0;transition:opacity .3s;pointer-events:none}
.photo-card img.loaded{opacity:1}
.card-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:5px;background:linear-gradient(to bottom,rgba(0,0,0,.65),transparent);opacity:0;transition:opacity .18s;z-index:2}
.photo-card:hover .card-top{opacity:1}
.ca{display:flex;align-items:center;gap:3px}
.ca-btn{width:26px;height:26px;border-radius:6px;border:none;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:background .12s;flex-shrink:0}
.ca-btn:hover{background:rgba(255,255,255,.28)}
.ca-btn.fav-on{color:#f46;background:rgba(255,60,60,.2)}.ca-btn.fav-on:hover{background:rgba(255,60,60,.35)}
.card-bot{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,rgba(0,0,0,.75),transparent);padding:26px 8px 7px;opacity:0;transition:opacity .18s;z-index:2;pointer-events:none}
.photo-card:hover .card-bot{opacity:1}
.card-fname{font-size:11px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.card-meta{font-size:10px;color:rgba(255,255,255,.6);margin-top:2px}
/* star row on card */
.card-stars{display:flex;gap:2px;margin-top:4px;pointer-events:all}
.card-star{font-size:13px;cursor:pointer;color:rgba(255,255,255,.25);transition:color .1s;line-height:1}
.card-star.on{color:#f5c518}
.card-star:hover,.card-star:hover ~ .card-star{color:rgba(255,255,255,.25)}
.card-bot:hover .card-stars{pointer-events:all}
/* tag pills on card */
.card-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px;pointer-events:none}
.card-tag{font-size:9px;padding:1px 5px;border-radius:8px;background:rgba(37,99,235,.5);color:#fff}

/* badges */
.fav-badge{position:absolute;top:5px;right:5px;font-size:13px;color:#f46;display:none;z-index:3;pointer-events:none;text-shadow:0 0 6px rgba(0,0,0,.8)}
.photo-card.is-fav .fav-badge{display:block}
.photo-card:hover .fav-badge{display:none}
.hidden-badge{position:absolute;top:5px;left:5px;background:rgba(0,0,0,.6);color:var(--muted);font-size:10px;padding:2px 6px;border-radius:10px;display:none;z-index:3;pointer-events:none}
.photo-card.is-hidden .hidden-badge{display:block}
.star-badge{position:absolute;bottom:5px;left:5px;font-size:11px;color:#f5c518;display:none;z-index:3;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.photo-card.has-stars .star-badge{display:block}
.photo-card:hover .star-badge{display:none}
.gallery-badge{position:absolute;bottom:5px;right:5px;background:rgba(0,0,0,.55);color:rgba(255,255,255,.7);font-size:9px;padding:2px 6px;border-radius:8px;z-index:3;pointer-events:none;display:none}
.photo-card.is-selected{box-shadow:0 0 0 3px var(--accent)}
.sel-overlay{position:absolute;inset:0;background:rgba(37,99,235,.22);display:none;z-index:1;pointer-events:none;align-items:flex-start;justify-content:flex-end;padding:6px}
.photo-card.is-selected .sel-overlay{display:flex}
.sel-check{width:20px;height:20px;border-radius:5px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px}
.photo-card.dragging{opacity:.2}
.photo-card.drop-before{box-shadow:0 0 0 3px var(--accent),-4px 0 0 0 var(--accent)}
.photo-card.drop-after{box-shadow:0 0 0 3px var(--accent),4px 0 0 0 var(--accent)}

/* RIGHT-CLICK CONTEXT MENU */
#ctx{display:none;position:fixed;z-index:5000;background:#1e1e1e;border:1px solid var(--border);border-radius:9px;padding:5px;min-width:180px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#ctx.open{display:block}
.ctx-item{padding:7px 12px;border-radius:6px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--text);transition:background .12s;user-select:none}
.ctx-item:hover{background:var(--surface)}
.ctx-item.danger{color:#f77}.ctx-item.danger:hover{background:#3a1a1a}
.ctx-sep{height:1px;background:var(--border);margin:4px 0}
.ctx-stars{padding:6px 12px;display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.ctx-star{font-size:16px;cursor:pointer;color:rgba(255,255,255,.2);transition:color .1s}
.ctx-star.on{color:#f5c518}
.ctx-star:hover{color:#f5c518}
.ctx-tag-row{padding:6px 12px}
.ctx-tag-input{width:100%;padding:5px 8px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:11px;outline:none}
.ctx-tag-input:focus{border-color:var(--accent)}
.ctx-quick-tags{display:flex;flex-wrap:wrap;gap:4px;padding:4px 12px 6px}
.ctx-qtag{font-size:10px;padding:2px 7px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .12s}
.ctx-qtag:hover{border-color:var(--accent);color:var(--accent)}
.ctx-qtag.on{border-color:var(--accent);color:var(--accent);background:rgba(37,99,235,.12)}

/* TOAST */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(16px);background:#222;color:#fff;border:1px solid var(--border);padding:8px 16px;border-radius:20px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:9999;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:#3d9;color:#3d9}
#toast.err{border-color:#f55;color:#f55}
#no-results{display:none;padding:50px 20px;text-align:center;color:var(--muted);font-size:13px}

/* LIGHTBOX */
#lightbox{display:none;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.95);align-items:center;justify-content:center}
#lightbox.open{display:flex}
#lb-toolbar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:7px;padding:9px 12px;background:linear-gradient(to bottom,rgba(0,0,0,.7),transparent);z-index:10}
.lb-tbtn{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:7px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;font-size:15px;transition:background .15s;flex-shrink:0}
.lb-tbtn:hover{background:rgba(255,255,255,.18)}
.lb-tbtn.playing{color:var(--accent);border-color:var(--accent)}
#lb-speed{padding:5px 7px;border-radius:6px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.08);color:#fff;font-size:11px;cursor:pointer;outline:none}
#lb-zoom-badge{font-size:11px;color:rgba(255,255,255,.45);min-width:40px}
#lb-spacer{flex:1}
#lb-img{max-width:calc(100vw - 100px);max-height:calc(100vh - 90px);border-radius:var(--radius);object-fit:contain;user-select:none;transform-origin:center;will-change:transform;cursor:zoom-in;display:block}
#lb-img.zoomed{cursor:grab}#lb-img.zoomed:active{cursor:grabbing}
.lb-side{position:fixed;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;width:42px;height:42px;border-radius:50%;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;z-index:10}
.lb-side:hover{background:rgba(255,255,255,.2)}
#lb-prev{left:8px}#lb-next{right:8px}
#lb-caption{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;padding:5px 13px;border-radius:20px;font-size:11px;white-space:nowrap;max-width:80vw;overflow:hidden;text-overflow:ellipsis;z-index:10}
#lb-progress{position:fixed;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.08);z-index:10;display:none}
#lb-progress.active{display:block}
#lb-progress-bar{height:100%;width:0%;background:var(--accent)}

/* PRINT */
@media print{
  header,#sel-bar,#gallery-tabs,#timeline,#tag-bar,#lb-toolbar,#lightbox,#toast,#empty,#no-results,
  .card-top,.ca-btn,.fav-badge,.hidden-badge,.sel-overlay,.gallery-badge,.star-badge,#ctx{display:none!important}
  body{background:#fff!important}
  #gallery{gap:3px;padding:0}
  .photo-card{break-inside:avoid;height:180px!important}
  .card-bot{opacity:1!important;background:rgba(0,0,0,.5)!important}
  .card-fname{font-size:9px!important}
}

/* EXPORT MODAL */
#exp-modal{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.7);align-items:center;justify-content:center}
#exp-modal.open{display:flex}
#exp-box{background:#1a1a1a;border:1px solid var(--border);border-radius:12px;padding:24px;width:360px;max-width:92vw}
#exp-box h3{font-size:15px;font-weight:600;margin-bottom:16px}
.exp-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:13px}
.exp-row label{color:var(--muted)}
.exp-row select{padding:5px 8px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;cursor:pointer;outline:none}
#exp-progress{display:none;margin:12px 0;background:var(--border);border-radius:3px;height:4px}
#exp-progress-bar{height:100%;width:0%;background:var(--accent);border-radius:3px}
#exp-status{font-size:11px;color:var(--muted);margin-bottom:10px;min-height:16px;display:none}
.exp-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <label class="btn btn-primary">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      Open Folder
      <input type="file" id="folderInput" accept="image/*" multiple webkitdirectory style="display:none"/>
    </label>
    <button class="btn btn-danger" id="clearBtn" style="display:none" title="Clear all photos and start fresh">✕ Clear</button>
    <div class="search-box">
      <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="search" placeholder="Search…"/>
    </div>
    <select class="sel" id="sortSel" style="display:none">
      <option value="name-az">Name A→Z</option>
      <option value="name-za">Name Z→A</option>
      <option value="date-new">Date newest</option>
      <option value="date-old">Date oldest</option>
      <option value="custom">Custom</option>
    </select>
    <select class="sel" id="starFilter" style="display:none">
      <option value="0">Any stars</option>
      <option value="1">★ 1+</option>
      <option value="2">★★ 2+</option>
      <option value="3">★★★ 3+</option>
      <option value="4">★★★★ 4+</option>
      <option value="5">★★★★★ 5 only</option>
    </select>
    <div class="slider-wrap" title="Row height">
      <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      <input type="range" id="sizeSlider" min="100" max="1200" value="220" step="10"/>
    </div>
    <div class="slider-wrap" title="Gap">
      <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
      <input type="range" id="gapSlider" min="0" max="20" value="4" step="1"/>
    </div>
    <span class="count" id="countBadge"></span>
  </div>

  <div class="hrow" id="row2" style="display:none">
    <button class="btn btn-ghost" id="shuffleBtn">
      <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/></svg>
      Shuffle
    </button>
    <button class="btn btn-ghost" id="favFilterBtn">♥ Favourites</button>
    <button class="btn btn-ghost" id="timelineBtn">
      <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><polyline points="8 8 3 12 8 16"/><polyline points="16 8 21 12 16 16"/></svg>
      Timeline
    </button>
    <button class="btn btn-ghost" id="showHiddenBtn">
      <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      Show Hidden
    </button>
    <button class="btn btn-ghost" id="selectBtn">
      <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      Select
    </button>
    <div class="hdivider"></div>
    <button class="btn btn-ghost" id="saveLayoutBtn">
      <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Save Layout
    </button>
    <label class="btn btn-ghost">
      <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 15v4a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Load Layout
      <input type="file" id="layoutInput" accept=".json" style="display:none"/>
    </label>
    <button class="btn btn-ghost" id="batBtn">
      <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="8" x2="13" y2="8"/><line x1="8" y1="16" x2="11" y2="16"/></svg>
      Rename Script
    </button>
    <div class="hdivider"></div>
    <button class="btn btn-ghost" id="exportBtn">
      <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Export / Print
    </button>
    <button class="btn btn-ghost" id="exportFavBtn" title="Export favourites as standalone HTML gallery">♥ Export Favourites</button>
  </div>
  <div id="gallery-tabs"></div>
  <div id="timeline"></div>
  <div id="tag-bar"><span id="tag-bar-label">Filter by tag:</span></div>
</header>

<div id="load-bar-wrap"><div id="load-bar"></div></div>

<div id="empty">
  <div class="icon">🖼️</div>
  <h2>Your photos will appear here</h2>
  <p>Click <strong>Open Folder</strong> to pick a folder. Subfolders become separate galleries. Right-click any photo for quick actions.</p>

<!-- Right-click context menu -->
<div id="ctx">
  <div class="ctx-item" id="ctx-open">🔍 Open photo</div>
  <div class="ctx-item" id="ctx-rotate">↻ Rotate 90°</div>

    <span class="ctx-star" data-s="2">★</span>
    <span class="ctx-star" data-s="3">★</span>
    <span class="ctx-star" data-s="4">★</span>
    <span class="ctx-star" data-s="5">★</span>
    <span class="ctx-star" data-s="0" style="font-size:10px;margin-left:4px;color:var(--muted)">✕</span>
  </div>
  <div class="ctx-sep"></div>
  <div class="ctx-tag-row">
    <input class="ctx-tag-input" id="ctx-tag-input" placeholder="Add tag, press Enter…" autocomplete="off"/>
  </div>

<!-- Lightbox -->
<div id="lightbox">
  <div id="lb-toolbar">
    <button class="lb-tbtn" id="lb-close">✕</button>
    <button class="lb-tbtn" id="lb-play">▶</button>

    <div id="lb-spacer"></div>
    <button class="lb-tbtn" id="lb-zoom-out">−</button>
    <button class="lb-tbtn" id="lb-zoom-reset">⊙</button>
    <button class="lb-tbtn" id="lb-zoom-in">+</button>
  </div>
  <button class="lb-side" id="lb-prev">‹</button>
  <img id="lb-img" src="" alt="" draggable="false"/>
  <button class="lb-side" id="lb-next">›</button>

<div id="exp-modal">

      <select id="exp-gallery"><option value="current">Current view</option></select>
    </div>
    <div class="exp-row"><label>Thumbnail size</label>
      <select id="exp-size"><option value="600">Small (600px)</option><option value="900" selected>Medium (900px)</option><option value="1200">Large (1200px)</option></select>
    </div>
    <div class="exp-row"><label>Include</label>
      <select id="exp-scope"><option value="all">All photos</option><option value="fav">Favourites only</option><option value="starred">Starred only</option></select>
    </div>
    <div id="exp-progress"><div id="exp-progress-bar"></div></div>
    <div id="exp-status"></div>

      <button class="btn btn-ghost" id="exp-cancel">Cancel</button>
      <button class="btn btn-ghost" id="exp-print">🖨 Print</button>
      <button class="btn btn-primary" id="exp-go">Export HTML</button>
    </div>
  </div>

<script>
/* ── REFS ── */
const gallery    = document.getElementById('gallery');
const emptyEl    = document.getElementById('empty');
const noResults  = document.getElementById('no-results');
const countBadge = document.getElementById('countBadge');
const searchInput= document.getElementById('search');
const sortSel    = document.getElementById('sortSel');
const starFilter = document.getElementById('starFilter');
const sizeSlider = document.getElementById('sizeSlider');
const gapSlider  = document.getElementById('gapSlider');
const lightbox   = document.getElementById('lightbox');
const lbImg      = document.getElementById('lb-img');
const lbCaption  = document.getElementById('lb-caption');
const lbZoomBadge= document.getElementById('lb-zoom-badge');
const lbProgress = document.getElementById('lb-progress');
const lbProgressBar=document.getElementById('lb-progress-bar');
const selBar     = document.getElementById('sel-bar');
const selCount   = document.getElementById('sel-count');
const toast      = document.getElementById('toast');
const row2       = document.getElementById('row2');
const loadBarWrap= document.getElementById('load-bar-wrap');
const loadBar    = document.getElementById('load-bar');
const loadLabel  = document.getElementById('load-label');
const galleryTabs= document.getElementById('gallery-tabs');
const timelineEl = document.getElementById('timeline');
const tagBar     = document.getElementById('tag-bar');
const ctx        = document.getElementById('ctx');

const IMAGE_EXTS = new Set(['jpg','jpeg','png','gif','webp','bmp','avif','tiff','tif','svg']);
const QUICK_TAGS = ['edit','print','share','best','delete'];

/* ── STATE ── */
let allPhotos=[], filtered=[];
let lbIndex=0, rowHeight=220, gapSize=4, folderName='photos';
let dragSrcIdx=-1, didDrag=false;
let favOnly=false, showHidden=false, showTimeline=false;
let selectMode=false, selectedSet=new Set(), lastSelIdx=-1;
let isLoading=false;
let currentGallery='all';
let activeTagFilters=new Set();
let ctxPhotoIdx=-1; // index into filtered for right-click target

/* ── HELPERS ── */
let toastTimer;
function showToast(msg,type=''){clearTimeout(toastTimer);toast.textContent=msg;toast.className='show '+type;toastTimer=setTimeout(()=>{toast.className='';},3200);}
function fmtSize(b){if(b<1024)return b+'B';if(b<1048576)return(b/1024).toFixed(0)+'KB';return(b/1048576).toFixed(1)+'MB';}
function fmtDate(ms){return ms?new Date(ms).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):''}
function fmtMonthYear(ms){if(!ms)return'Unknown';const d=new Date(ms);return d.toLocaleDateString(undefined,{year:'numeric',month:'short'});}
function effectiveAspect(p){return(p.rot===90||p.rot===270)?1/p.aspect:p.aspect;}
function setImgTransform(img,cardW,rot){
  img.style.position='absolute';img.style.top='50%';img.style.left='50%';
  if(rot===0||rot===180){img.style.width='100%';img.style.height='100%';img.style.transform=`translate(-50%,-50%) rotate(${rot}deg)`;}
  else{img.style.width=rowHeight+'px';img.style.height=cardW+'px';img.style.transform=`translate(-50%,-50%) rotate(${rot}deg)`;}
}
function starsHTML(n){return'★'.repeat(n)+'☆'.repeat(5-n);}
function allTags(){const s=new Set();allPhotos.forEach(p=>p.tags.forEach(t=>s.add(t)));return[...s].sort();}

/* ── GALLERY TABS ── */
function getGalleryName(file){
  if(!file.webkitRelativePath)return folderName;
  const parts=file.webkitRelativePath.split('/');
  return parts.length<=2?parts[0]:parts.slice(1,-1).join(' / ');
}
function buildTabs(){
  const names=[...new Set(allPhotos.map(p=>p.gallery))].sort((a,b)=>a.localeCompare(b));
  const hasSub=names.length>1;
  galleryTabs.style.display=hasSub?'block':'none';
  if(!hasSub)return;
  galleryTabs.innerHTML='';
  [['all','📁 All',allPhotos.length],...names.map(n=>[n,n,allPhotos.filter(p=>p.gallery===n).length])].forEach(([val,label,cnt])=>{
    const tab=document.createElement('div');
    tab.className='gtab'+(currentGallery===val?' active':'');
    tab.innerHTML=`${label} <span class="tc">${cnt}</span>`;
    tab.addEventListener('click',()=>switchGallery(val));
    galleryTabs.appendChild(tab);
  });
  // Also populate export gallery selector
  populateExpGallery(names);
}
function switchGallery(name){
  currentGallery=name;buildTabs();applyFilter();
  const active=galleryTabs.querySelector('.gtab.active');
  if(active)active.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
}
function populateExpGallery(names){
  const sel=document.getElementById('exp-gallery');
  sel.innerHTML='<option value="current">Current view</option>';
  names.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;sel.appendChild(o);});
  if(names.length>1){const o=document.createElement('option');o.value='all';o.textContent='All galleries';sel.appendChild(o);}
}

/* ── TIMELINE ── */
document.getElementById('timelineBtn').addEventListener('click',()=>{
  showTimeline=!showTimeline;
  document.getElementById('timelineBtn').classList.toggle('on',showTimeline);
  buildTimeline();
});
function buildTimeline(){
  if(!showTimeline||!allPhotos.length){timelineEl.classList.remove('visible');return;}
  // Group by month
  const byMonth={};
  filtered.forEach(p=>{
    if(!p.modified)return;
    const key=new Date(p.modified).toISOString().slice(0,7); // YYYY-MM
    if(!byMonth[key])byMonth[key]={label:fmtMonthYear(p.modified),photos:[]};
    byMonth[key].photos.push(p);
  });
  const months=Object.keys(byMonth).sort();
  if(!months.length){timelineEl.classList.remove('visible');return;}
  timelineEl.classList.add('visible');
  timelineEl.innerHTML='';
  const maxCnt=Math.max(...months.map(m=>byMonth[m].photos.length));
  months.forEach(key=>{
    const grp=byMonth[key];
    const barH=Math.max(6,Math.round((grp.photos.length/maxCnt)*28));
    const div=document.createElement('div');div.className='tl-month';
    div.innerHTML=`<div class="tl-bar" style="height:${barH}px"></div><div class="tl-label">${grp.label}</div><div class="tl-cnt">${grp.photos.length}</div>`;
    div.addEventListener('click',()=>{
      // Scroll gallery to first photo of this month
      const target=grp.photos[0];
      const cards=gallery.querySelectorAll('.photo-card');
      const idx=filtered.indexOf(target);
      if(cards[idx]){cards[idx].scrollIntoView({behavior:'smooth',block:'start'});}
      timelineEl.querySelectorAll('.tl-month').forEach(m=>m.classList.remove('active'));
      div.classList.add('active');
    });
    timelineEl.appendChild(div);
  });
}

/* ── TAG BAR ── */
function buildTagBar(){
  const tags=allTags();
  tagBar.innerHTML='';
  if(!tags.length){tagBar.classList.remove('visible');return;}
  const lbl=document.createElement('span');lbl.id='tag-bar-label';lbl.style.cssText='font-size:11px;color:var(--muted)';lbl.textContent='Tags:';
  tagBar.appendChild(lbl);
  tags.forEach(tag=>{
    const chip=document.createElement('div');
    chip.className='tag-chip'+(activeTagFilters.has(tag)?' on':'');
    chip.innerHTML=`${tag}`;
    chip.addEventListener('click',()=>{
      activeTagFilters.has(tag)?activeTagFilters.delete(tag):activeTagFilters.add(tag);
      chip.classList.toggle('on',activeTagFilters.has(tag));
      applyFilter();
    });
    tagBar.appendChild(chip);
  });
  if(activeTagFilters.size){
    const clr=document.createElement('div');clr.className='tag-chip';clr.style.color='#f77';clr.style.borderColor='#5a2a2a';clr.textContent='✕ clear';
    clr.addEventListener('click',()=>{activeTagFilters.clear();buildTagBar();applyFilter();});
    tagBar.appendChild(clr);
  }
  tagBar.classList.add('visible');
}

/* ── FILE LOADING ── */
document.getElementById('folderInput').addEventListener('change',e=>{
  const files=Array.from(e.target.files).filter(f=>IMAGE_EXTS.has(f.name.split('.').pop().toLowerCase()));
  loadFiles(files);
});
function loadPhotoMeta(file){
  return new Promise(resolve=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>resolve({name:file.name,url,aspect:img.naturalWidth/img.naturalHeight,modified:file.lastModified,size:file.size,w:img.naturalWidth,h:img.naturalHeight,fav:false,hidden:false,rot:0,stars:0,tags:[],gallery:''});
    img.onerror=()=>{URL.revokeObjectURL(url);resolve(null);};
    img.src=url;
  });
}
function appendLoadingCards(photos){
  const frag=document.createDocumentFragment();
  photos.forEach(photo=>{
    const ea=effectiveAspect(photo),cardW=ea*rowHeight;
    const card=document.createElement('div');card.className='photo-card';card.style.width=cardW+'px';card.style.flexGrow=cardW;
    const img=document.createElement('img');img.alt=photo.name;img.loading='lazy';img.addEventListener('load',()=>img.classList.add('loaded'));setImgTransform(img,cardW,photo.rot);img.src=photo.url;
    card.appendChild(img);frag.appendChild(card);
  });
  gallery.appendChild(frag);
}
async function loadFiles(files){
  allPhotos.forEach(p=>URL.revokeObjectURL(p.url));
  allPhotos=[];selectedSet.clear();activeTagFilters.clear();currentGallery='all';
  gallery.innerHTML='';isLoading=true;
  if(files[0]?.webkitRelativePath)folderName=files[0].webkitRelativePath.split('/')[0];
  files.sort((a,b)=>a.name.localeCompare(b.name));
  emptyEl.style.display='none';row2.style.display='';sortSel.style.display='';starFilter.style.display='';sortSel.value='name-az';
  galleryTabs.style.display='none';timelineEl.classList.remove('visible');tagBar.classList.remove('visible');
  loadBarWrap.style.display='block';loadLabel.style.display='block';loadBar.style.width='0%';
  const BATCH=30,total=files.length;let done=0;
  for(let i=0;i<total;i+=BATCH){
    const chunk=files.slice(i,i+BATCH);
    const results=await Promise.all(chunk.map(f=>loadPhotoMeta(f).then(p=>{if(p)p.gallery=getGalleryName(f);return p;})));
    const valid=results.filter(Boolean);
    allPhotos.push(...valid);done+=chunk.length;
    loadBar.style.width=Math.round((done/total)*100)+'%';loadLabel.textContent=`Loading… ${done} / ${total}`;
    appendLoadingCards(valid);countBadge.textContent=allPhotos.length+' photos';
    await new Promise(r=>setTimeout(r,0));
  }
  loadBar.style.width='100%';
  setTimeout(()=>{loadBarWrap.style.display='none';loadLabel.style.display='none';loadBar.style.width='0%';},400);
  isLoading=false;buildTabs();buildTagBar();applyFilter();
  document.getElementById('clearBtn').style.display='';
}

// Clear button
document.getElementById('clearBtn').addEventListener('click',()=>{
  if(!allPhotos.length)return;
  if(!confirm('Clear all photos and start fresh?'))return;
  allPhotos.forEach(p=>URL.revokeObjectURL(p.url));
  allPhotos=[];filtered=[];selectedSet.clear();activeTagFilters.clear();currentGallery='all';
  gallery.innerHTML='';
  emptyEl.style.display='';row2.style.display='none';sortSel.style.display='none';starFilter.style.display='none';
  galleryTabs.style.display='none';timelineEl.classList.remove('visible');tagBar.classList.remove('visible');
  selBar.classList.remove('visible');countBadge.textContent='';
  document.getElementById('clearBtn').style.display='none';
  document.getElementById('folderInput').value='';
  showToast('Cleared — open a new folder','ok');
});

/* ── SORT / SHUFFLE ── */
sortSel.addEventListener('change',applyFilter);
starFilter.addEventListener('change',applyFilter);
function sortedPhotos(arr){
  const v=sortSel.value,c=[...arr];
  if(v==='name-az')c.sort((a,b)=>a.name.localeCompare(b.name));
  if(v==='name-za')c.sort((a,b)=>b.name.localeCompare(a.name));
  if(v==='date-new')c.sort((a,b)=>b.modified-a.modified);
  if(v==='date-old')c.sort((a,b)=>a.modified-b.modified);
  return c;
}
document.getElementById('shuffleBtn').addEventListener('click',()=>{
  for(let i=allPhotos.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[allPhotos[i],allPhotos[j]]=[allPhotos[j],allPhotos[i]];}
  sortSel.value='custom';applyFilter();
});

/* ── FILTER TOGGLES ── */
document.getElementById('favFilterBtn').addEventListener('click',()=>{favOnly=!favOnly;document.getElementById('favFilterBtn').classList.toggle('on',favOnly);applyFilter();});
document.getElementById('showHiddenBtn').addEventListener('click',()=>{showHidden=!showHidden;document.getElementById('showHiddenBtn').classList.toggle('on',showHidden);applyFilter();});

/* ── SELECT MODE ── */
document.getElementById('selectBtn').addEventListener('click',()=>{selectMode=!selectMode;document.getElementById('selectBtn').classList.toggle('on',selectMode);if(!selectMode){selectedSet.clear();updateSelBar();}renderGallery();});
function updateSelBar(){const n=selectedSet.size;selBar.classList.toggle('visible',n>0);selCount.textContent=n+' selected';}
document.getElementById('sel-fav').addEventListener('click',()=>{selectedSet.forEach(name=>{const p=allPhotos.find(x=>x.name===name);if(p)p.fav=true;});applyFilter();showToast(`♥ ${selectedSet.size} favourited`,'ok');});
document.getElementById('sel-hide').addEventListener('click',()=>{selectedSet.forEach(name=>{const p=allPhotos.find(x=>x.name===name);if(p)p.hidden=true;});selectedSet.clear();applyFilter();showToast('Photos hidden','ok');});
document.getElementById('sel-top').addEventListener('click',()=>{const s=[...selectedSet],picked=allPhotos.filter(p=>s.includes(p.name)),rest=allPhotos.filter(p=>!s.includes(p.name));allPhotos=[...picked,...rest];sortSel.value='custom';selectedSet.clear();applyFilter();});
document.getElementById('sel-bot').addEventListener('click',()=>{const s=[...selectedSet],picked=allPhotos.filter(p=>s.includes(p.name)),rest=allPhotos.filter(p=>!s.includes(p.name));allPhotos=[...rest,...picked];sortSel.value='custom';selectedSet.clear();applyFilter();});
document.getElementById('sel-clear').addEventListener('click',()=>{selectedSet.clear();updateSelBar();renderGallery();});

/* ── FILTER + RENDER ── */
searchInput.addEventListener('input',applyFilter);
function applyFilter(){
  if(isLoading)return;
  const q=searchInput.value.trim().toLowerCase();
  const minStars=parseInt(starFilter.value)||0;
  let pool=sortedPhotos(allPhotos);
  if(currentGallery!=='all')pool=pool.filter(p=>p.gallery===currentGallery);
  if(!showHidden)pool=pool.filter(p=>!p.hidden);
  if(favOnly)pool=pool.filter(p=>p.fav);
  if(minStars===5)pool=pool.filter(p=>p.stars===5);
  else if(minStars>0)pool=pool.filter(p=>p.stars>=minStars);
  if(activeTagFilters.size)pool=pool.filter(p=>p.tags&&[...activeTagFilters].every(t=>p.tags.includes(t)));
  if(q)pool=pool.filter(p=>p.name.toLowerCase().includes(q)||p.tags.some(t=>t.includes(q)));
  filtered=pool;
  renderGallery();updateCount();
  noResults.style.display=(allPhotos.length>0&&filtered.length===0)?'block':'none';
  if(showTimeline)buildTimeline();
}
function updateCount(){
  if(!allPhotos.length){countBadge.textContent='';return;}
  countBadge.textContent=filtered.length===allPhotos.length?`${allPhotos.length} photos`:`${filtered.length} / ${allPhotos.length}`;
}

/* ── RENDER GALLERY ── */
function clearDropClasses(){gallery.querySelectorAll('.photo-card').forEach(c=>c.classList.remove('drop-before','drop-after','dragging'));}
function makeCA(label,title,handler){
  const b=document.createElement('button');b.className='ca-btn';b.title=title;b.textContent=label;
  b.addEventListener('click',e=>{e.stopPropagation();handler();});return b;
}
function renderGallery(){
  gallery.innerHTML='';
  const frag=document.createDocumentFragment();
  const showGalLabel=galleryTabs.style.display!=='none'&&currentGallery==='all';
  // Date dividers when sorted by date
  const byDate=sortSel.value==='date-new'||sortSel.value==='date-old';
  let lastMonth='';

  filtered.forEach((photo,i)=>{
    if(byDate&&photo.modified){
      const m=fmtMonthYear(photo.modified);
      if(m!==lastMonth){lastMonth=m;const div=document.createElement('div');div.className='date-divider';div.textContent=m;frag.appendChild(div);}
    }
    const ea=effectiveAspect(photo),cardW=ea*rowHeight;
    const card=document.createElement('div');
    let cls='photo-card';
    if(photo.fav)cls+=' is-fav';
    if(photo.hidden)cls+=' is-hidden';
    if(photo.stars>0)cls+=' has-stars';
    if(selectedSet.has(photo.name))cls+=' is-selected';
    card.className=cls;
    card.style.width=cardW+'px';card.style.flexGrow=cardW;
    if(!selectMode)card.draggable=true;

    const img=document.createElement('img');img.alt=photo.name;img.loading='lazy';
    img.addEventListener('load',()=>img.classList.add('loaded'));setImgTransform(img,cardW,photo.rot);img.src=photo.url;

    // top bar
    const top=document.createElement('div');top.className='card-top';
    const caL=document.createElement('div');caL.className='ca';
    const caR=document.createElement('div');caR.className='ca';
    const btnFav=makeCA(photo.fav?'♥':'♡',photo.fav?'Unfavourite':'Favourite',()=>toggleFav(i));
    if(photo.fav)btnFav.classList.add('fav-on');
    caL.append(makeCA('↑','Move up',()=>movePhoto(i,-1)),makeCA('↓','Move down',()=>movePhoto(i,+1)));
    caR.append(makeCA('↻','Rotate 90°',()=>rotatePhoto(i)),btnFav,makeCA('✕','Hide',()=>hidePhoto(i)));
    top.append(caL,caR);

    // bottom
    const bot=document.createElement('div');bot.className='card-bot';
    const fn=document.createElement('div');fn.className='card-fname';fn.textContent=photo.name;
    const fm=document.createElement('div');fm.className='card-meta';
    fm.textContent=[photo.w&&photo.h?`${photo.w}×${photo.h}`:'',photo.size?fmtSize(photo.size):'',fmtDate(photo.modified)].filter(Boolean).join(' · ');
    // Stars row
    const starsRow=document.createElement('div');starsRow.className='card-stars';
    for(let s=1;s<=5;s++){
      const st=document.createElement('span');st.className='card-star'+(s<=photo.stars?' on':'');st.textContent='★';
      st.addEventListener('click',e=>{e.stopPropagation();setStars(i,s===photo.stars?0:s);});
      starsRow.appendChild(st);
    }
    // Tags
    const tagsRow=document.createElement('div');tagsRow.className='card-tags';
    photo.tags.forEach(t=>{const tc=document.createElement('span');tc.className='card-tag';tc.textContent=t;tagsRow.appendChild(tc);});
    bot.append(fn,fm,starsRow,tagsRow);

    // badges
    const favB=document.createElement('div');favB.className='fav-badge';favB.textContent='♥';
    const hidB=document.createElement('div');hidB.className='hidden-badge';hidB.textContent='hidden';
    const starB=document.createElement('div');starB.className='star-badge';starB.textContent='★'.repeat(photo.stars);
    const galB=document.createElement('div');galB.className='gallery-badge';galB.textContent=photo.gallery;if(showGalLabel)galB.style.display='block';
    const selOv=document.createElement('div');selOv.className='sel-overlay';
    const selChk=document.createElement('div');selChk.className='sel-check';selChk.textContent='✓';selOv.appendChild(selChk);

    card.append(img,top,bot,favB,hidB,starB,galB,selOv);

    // drag
    if(!selectMode){
      card.addEventListener('dragstart',e=>{dragSrcIdx=i;didDrag=false;e.dataTransfer.effectAllowed='move';setTimeout(()=>card.classList.add('dragging'),0);});
      card.addEventListener('dragend',clearDropClasses);
      card.addEventListener('dragover',e=>{e.preventDefault();clearDropClasses();const mid=card.getBoundingClientRect().left+card.offsetWidth/2;card.classList.add(e.clientX<mid?'drop-before':'drop-after');});
      card.addEventListener('dragleave',()=>card.classList.remove('drop-before','drop-after'));
      card.addEventListener('drop',e=>{
        e.preventDefault();if(dragSrcIdx===i)return;
        const mid=card.getBoundingClientRect().left+card.offsetWidth/2,after=e.clientX>=mid;
        const src=filtered[dragSrcIdx],tgt=filtered[i];
        const si=allPhotos.indexOf(src);allPhotos.splice(si,1);
        const ti=allPhotos.indexOf(tgt);allPhotos.splice(after?ti+1:ti,0,src);
        sortSel.value='custom';didDrag=true;applyFilter();
      });
    }

    // click
    card.addEventListener('click',e=>{
      if(didDrag){didDrag=false;return;}
      if(e.target.closest('.ca-btn')||e.target.closest('.card-stars'))return;
      if(selectMode){
        if(e.shiftKey&&lastSelIdx>=0){const lo=Math.min(i,lastSelIdx),hi=Math.max(i,lastSelIdx);for(let k=lo;k<=hi;k++)selectedSet.add(filtered[k].name);}
        else{selectedSet.has(photo.name)?selectedSet.delete(photo.name):selectedSet.add(photo.name);}
        lastSelIdx=i;updateSelBar();renderGallery();
      } else {openLightbox(i);}
    });

    // right-click
    card.addEventListener('contextmenu',e=>{e.preventDefault();openCtxMenu(e,i);});

    frag.appendChild(card);
  });
  gallery.appendChild(frag);
  updateSelBar();
}

/* ── PHOTO ACTIONS ── */
function movePhoto(filtIdx,dir){const p=filtered[filtIdx],ai=allPhotos.indexOf(p),ni=ai+dir;if(ni<0||ni>=allPhotos.length)return;[allPhotos[ai],allPhotos[ni]]=[allPhotos[ni],allPhotos[ai]];sortSel.value='custom';applyFilter();}
function rotatePhoto(filtIdx){filtered[filtIdx].rot=(filtered[filtIdx].rot+90)%360;applyFilter();}
function toggleFav(filtIdx){filtered[filtIdx].fav=!filtered[filtIdx].fav;applyFilter();}
function hidePhoto(filtIdx){const p=filtered[filtIdx];p.hidden=true;closeCtx();applyFilter();showToast(`"${p.name}" hidden`);}
function setStars(filtIdx,n){filtered[filtIdx].stars=n;buildTagBar();applyFilter();}
function addTag(filtIdx,tag){
  tag=tag.trim().toLowerCase();if(!tag)return;
  const p=filtered[filtIdx];
  if(!p.tags.includes(tag))p.tags.push(tag);
  buildTagBar();applyFilter();
}
function removeTag(filtIdx,tag){const p=filtered[filtIdx];p.tags=p.tags.filter(t=>t!==tag);buildTagBar();applyFilter();}

/* ── CONTEXT MENU ── */
function openCtxMenu(e,filtIdx){
  ctxPhotoIdx=filtIdx;
  const photo=filtered[filtIdx];
  // Update fav label
  document.getElementById('ctx-fav').textContent=photo.fav?'♡ Unfavourite':'♥ Favourite';
  // Update stars
  document.querySelectorAll('.ctx-star').forEach(s=>{const n=parseInt(s.dataset.s);s.classList.toggle('on',n>0&&n<=photo.stars);});
  // Update quick tags
  const qtc=document.getElementById('ctx-quick-tags');qtc.innerHTML='';
  QUICK_TAGS.forEach(tag=>{
    const b=document.createElement('div');b.className='ctx-qtag'+(photo.tags.includes(tag)?' on':'');b.textContent=tag;
    b.addEventListener('click',()=>{photo.tags.includes(tag)?removeTag(filtIdx,tag):addTag(filtIdx,tag);b.classList.toggle('on',photo.tags.includes(tag));});
    qtc.appendChild(b);
  });
  // Show current tags as removable pills
  photo.tags.filter(t=>!QUICK_TAGS.includes(t)).forEach(tag=>{
    const b=document.createElement('div');b.className='ctx-qtag on';b.textContent=tag+' ✕';
    b.addEventListener('click',()=>{removeTag(filtIdx,tag);openCtxMenu({clientX:parseInt(ctx.style.left),clientY:parseInt(ctx.style.top)},filtIdx);});
    qtc.appendChild(b);
  });
  document.getElementById('ctx-tag-input').value='';
  // Position
  const x=Math.min(e.clientX,window.innerWidth-200);
  const y=Math.min(e.clientY,window.innerHeight-ctx.offsetHeight-10);
  ctx.style.left=x+'px';ctx.style.top=y+'px';
  ctx.classList.add('open');
}
function closeCtx(){ctx.classList.remove('open');ctxPhotoIdx=-1;}
document.addEventListener('click',e=>{if(!ctx.contains(e.target))closeCtx();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCtx();});
document.getElementById('ctx-open').addEventListener('click',()=>{if(ctxPhotoIdx>=0){openLightbox(ctxPhotoIdx);}closeCtx();});
document.getElementById('ctx-rotate').addEventListener('click',()=>{if(ctxPhotoIdx>=0)rotatePhoto(ctxPhotoIdx);closeCtx();});
document.getElementById('ctx-fav').addEventListener('click',()=>{if(ctxPhotoIdx>=0)toggleFav(ctxPhotoIdx);closeCtx();});
document.getElementById('ctx-hide').addEventListener('click',()=>{if(ctxPhotoIdx>=0)hidePhoto(ctxPhotoIdx);});
document.querySelectorAll('.ctx-star').forEach(s=>{
  s.addEventListener('click',()=>{
    if(ctxPhotoIdx<0)return;
    const n=parseInt(s.dataset.s);
    setStars(ctxPhotoIdx,n===filtered[ctxPhotoIdx]?.stars?0:n);
    document.querySelectorAll('.ctx-star').forEach(ss=>{const sn=parseInt(ss.dataset.s);ss.classList.toggle('on',sn>0&&sn<=(filtered[ctxPhotoIdx]?.stars||0));});
  });

document.getElementById('ctx-tag-input').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&ctxPhotoIdx>=0){addTag(ctxPhotoIdx,e.target.value);e.target.value='';openCtxMenu({clientX:parseInt(ctx.style.left),clientY:parseInt(ctx.style.top)},ctxPhotoIdx);}
  e.stopPropagation();
});
document.getElementById('ctx-tag-input').addEventListener('click',e=>e.stopPropagation());

/* ── LIGHTBOX ── */
function openLightbox(index){lbIndex=index;resetZoom();showLbPhoto();lightbox.classList.add('open');}
function showLbPhoto(){
  const p=filtered[lbIndex];lbImg.src=p.url;lbImg.alt=p.name;lbImg.style.transform=`rotate(${p.rot}deg)`;
  lbCaption.textContent=`${p.name}  ·  ${lbIndex+1} / ${filtered.length}${p.stars?'  ·  '+'★'.repeat(p.stars):''}`;
  resetZoom();
}
function closeLightbox(){stopSlideshow();lightbox.classList.remove('open');lbImg.src='';resetZoom();}
function lbPrev(){lbIndex=(lbIndex-1+filtered.length)%filtered.length;showLbPhoto();}
function lbNext(){lbIndex=(lbIndex+1)%filtered.length;showLbPhoto();}
document.getElementById('lb-prev').addEventListener('click',()=>{lbPrev();if(isPlaying)restartProgress();});
document.getElementById('lb-next').addEventListener('click',()=>{lbNext();if(isPlaying)restartProgress();});
document.getElementById('lb-close').addEventListener('click',closeLightbox);
lightbox.addEventListener('click',e=>{if(e.target===lightbox)closeLightbox();});
document.addEventListener('keydown',e=>{
  if(!lightbox.classList.contains('open'))return;
  if(e.key==='Escape'){closeLightbox();return;}
  if(e.key==='ArrowLeft'){lbPrev();if(isPlaying)restartProgress();}
  if(e.key==='ArrowRight'){lbNext();if(isPlaying)restartProgress();}
  if(e.key==='+'||e.key==='=')zoomBy(0.5);
  if(e.key==='-')zoomBy(-0.5);
  if(e.key==='0')resetZoom();
  if(e.key===' '){e.preventDefault();toggleSlideshow();}
});
let zoomLevel=1,panX=0,panY=0,isPanning=false,panStartX,panStartY,panOriginX,panOriginY;
function applyZoom(){const rot=(filtered[lbIndex]||{}).rot||0;lbImg.style.transform=`scale(${zoomLevel}) translate(${panX}px,${panY}px) rotate(${rot}deg)`;lbZoomBadge.textContent=Math.round(zoomLevel*100)+'%';lbImg.classList.toggle('zoomed',zoomLevel>1);}
function zoomBy(d){zoomLevel=Math.min(15,Math.max(1,zoomLevel+d));if(zoomLevel===1){panX=0;panY=0;}applyZoom();}
function resetZoom(){zoomLevel=1;panX=0;panY=0;if(filtered[lbIndex])lbImg.style.transform=`rotate(${filtered[lbIndex].rot}deg)`;lbZoomBadge.textContent='100%';lbImg.classList.remove('zoomed');}
document.getElementById('lb-zoom-in').addEventListener('click',()=>zoomBy(1));
document.getElementById('lb-zoom-out').addEventListener('click',()=>zoomBy(-1));
document.getElementById('lb-zoom-reset').addEventListener('click',resetZoom);
lightbox.addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY<0?.5:-.5);},{passive:false});
lbImg.addEventListener('dblclick',()=>zoomLevel>1?resetZoom():zoomBy(2));
lbImg.addEventListener('mousedown',e=>{if(zoomLevel<=1)return;e.preventDefault();isPanning=true;panStartX=e.clientX;panStartY=e.clientY;panOriginX=panX;panOriginY=panY;});
document.addEventListener('mousemove',e=>{if(!isPanning)return;panX=panOriginX+(e.clientX-panStartX)/zoomLevel;panY=panOriginY+(e.clientY-panStartY)/zoomLevel;applyZoom();});
document.addEventListener('mouseup',()=>{isPanning=false;});
let isPlaying=false,slideshowTimer=null;
const lbPlayBtn=document.getElementById('lb-play');
function toggleSlideshow(){isPlaying?stopSlideshow():startSlideshow();}
function startSlideshow(){isPlaying=true;lbPlayBtn.textContent='⏸';lbPlayBtn.classList.add('playing');lbProgress.classList.add('active');scheduleNext();}
function stopSlideshow(){isPlaying=false;lbPlayBtn.textContent='▶';lbPlayBtn.classList.remove('playing');lbProgress.classList.remove('active');clearTimeout(slideshowTimer);lbProgressBar.style.transition='none';lbProgressBar.style.width='0%';}
function scheduleNext(){const delay=parseInt(document.getElementById('lb-speed').value);lbProgressBar.style.transition='none';lbProgressBar.style.width='0%';lbProgressBar.offsetWidth;lbProgressBar.style.transition=`width ${delay}ms linear`;lbProgressBar.style.width='100%';slideshowTimer=setTimeout(()=>{if(isPlaying){lbNext();scheduleNext();}},delay);}
function restartProgress(){clearTimeout(slideshowTimer);scheduleNext();}
lbPlayBtn.addEventListener('click',toggleSlideshow);
document.getElementById('lb-speed').addEventListener('change',()=>{if(isPlaying){clearTimeout(slideshowTimer);scheduleNext();}});

/* ── SAVE / LOAD LAYOUT ── */
document.getElementById('saveLayoutBtn').addEventListener('click',async()=>{
  if(!allPhotos.length)return;
  const data={photoboard:'1.1',folder:folderName,saved:new Date().toISOString(),rowHeight,gapSize,sort:sortSel.value,
    order:sortedPhotos(allPhotos).map(p=>({name:p.name,fav:p.fav,hidden:p.hidden,rot:p.rot,gallery:p.gallery,stars:p.stars,tags:p.tags}))};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const name=`photoboard_${folderName}.json`;
  if(window.showSaveFilePicker){
    try{const fh=await window.showSaveFilePicker({suggestedName:name,types:[{description:'Layout',accept:{'application/json':['.json']}}]});const w=await fh.createWritable();await w.write(blob);await w.close();showToast('✓ Layout saved','ok');}
    catch(e){if(e.name!=='AbortError')showToast('Save failed','err');}
  } else {const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href);showToast('✓ Saved to Downloads','ok');}
});
document.getElementById('layoutInput').addEventListener('change',e=>{
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(!data.order||!Array.isArray(data.order))throw new Error();
      const map={};allPhotos.forEach(p=>{map[p.name]=p;});
      const ordered=data.order.filter(o=>map[o.name]).map(o=>{const p=map[o.name];p.fav=!!o.fav;p.hidden=!!o.hidden;p.rot=o.rot||0;p.stars=o.stars||0;p.tags=o.tags||[];return p;});
      const unsaved=allPhotos.filter(p=>!data.order.find(o=>o.name===p.name));
      allPhotos=[...ordered,...unsaved];
      if(data.rowHeight){rowHeight=data.rowHeight;sizeSlider.value=rowHeight;document.documentElement.style.setProperty('--rh',rowHeight+'px');}
      if(data.gapSize!=null){gapSize=data.gapSize;gapSlider.value=gapSize;document.documentElement.style.setProperty('--gap',gapSize+'px');}
      sortSel.value='custom';buildTabs();buildTagBar();applyFilter();showToast(`✓ Layout restored`,'ok');
    }catch{showToast('Could not read layout file','err');}
    e.target.value='';
  };
  reader.readAsText(file);
});

/* ── RENAME SCRIPT ── */
document.getElementById('batBtn').addEventListener('click',()=>{
  if(!allPhotos.length)return;
  const order=sortedPhotos(allPhotos);const digits=String(order.length).length;const pad=n=>String(n).padStart(digits,'0');
  let cmds='';

  order.forEach((p,i)=>{const n=`${pad(i+1)}_${p.name}`;if(p.name!==n)cmds+=`ren "__tmp_${pad(i+1)}_${p.name}" "${n}"\r\n`;});
  const preview=order.slice(0,5).map((p,i)=>`rem   ${p.name}  →  ${pad(i+1)}_${p.name}`).join('\r\n');
  const bat=[`@echo off`,`rem PhotoBoard Rename Script — ${folderName}`,`rem`,`rem PREVIEW (first 5):`,preview,`rem`,`cd /d "%~dp0"`,``,`set /p confirm=Type YES and press Enter to rename: `,`if /i not "%confirm%"=="YES" (echo Cancelled. & pause & exit /b)`,`echo Renaming...`,cmds,`echo Done!`,`pause`].join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bat],{type:'text/plain'}));a.download=`rename_${folderName}.bat`;a.click();URL.revokeObjectURL(a.href);

function getExportPhotos(){
  const galleryVal=document.getElementById('exp-gallery').value;
  const scope=document.getElementById('exp-scope').value;

  if(galleryVal==='current') photos=filtered.filter(p=>!p.hidden);

  if(scope==='fav') photos=photos.filter(p=>p.fav);

async function photoToBase64(photo,maxPx){
  return new Promise(resolve=>{
    const img=new Image();img.src=photo.url;
    img.onload=()=>{
      let w=img.naturalWidth,h=img.naturalHeight;const isSwapped=(photo.rot===90||photo.rot===270);if(isSwapped)[w,h]=[h,w];
      const scale=Math.min(1,maxPx/Math.max(w,h));const cw=Math.round(w*scale),ch=Math.round(h*scale);
      const cv=document.createElement('canvas');cv.width=cw;cv.height=ch;const ctx2=cv.getContext('2d');ctx2.save();
      if(photo.rot!==0){ctx2.translate(cw/2,ch/2);ctx2.rotate(photo.rot*Math.PI/180);const ow=isSwapped?ch:cw,oh=isSwapped?cw:ch;ctx2.drawImage(img,-ow/2,-oh/2,ow,oh);}
      else{ctx2.drawImage(img,0,0,cw,ch);}ctx2.restore();resolve(cv.toDataURL('image/jpeg',0.82));
    };img.onerror=()=>resolve(null);
  });
}

function buildExportHTML(thumbs,folder){

    const w=t.aspect*220;

    const starStr=t.stars?`<span class="sb">${'★'.repeat(t.stars)}</span>`:'';
    const tagStr=t.tags&&t.tags.length?t.tags.map(g=>`<span class="tg">${g}</span>`).join(''):'';
    return `<div class="pc" data-idx="${idx}" data-gallery="${t.gallery||''}" style="width:${w.toFixed(1)}px;flex-grow:${w.toFixed(1)}">
<img src="${t.b64}" alt="${t.name.replace(/"/g,'&quot;')}" loading="lazy"/>${t.fav?'<span class="fb">♥</span>':''}${starStr}
<div class="info"><div class="fn">${t.name}</div><div class="fm">${meta}</div><div class="ftags">${tagStr}</div></div></div>`;
  }).join('\n');
  const tabsHTML=hasGalleries?`<div id="tabs"><div class="tab active" data-g="all">📁 All <span class="tc">${thumbs.length}</span></div>${galleryNames.map(g=>`<div class="tab" data-g="${g}">${g} <span class="tc">${thumbs.filter(t=>t.gallery===g).length}</span></div>`).join('')}</div>`:'';
  return `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Gallery — ${folder}</title><style>

.fb{position:absolute;top:6px;right:6px;color:#f46;font-size:14px;pointer-events:none}
.sb{position:absolute;top:6px;left:6px;color:#f5c518;font-size:11px;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.8)}
#lb{display:none;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.95);align-items:center;justify-content:center}
#lb.open{display:flex}#lb img{max-width:calc(100vw - 80px);max-height:calc(100vh - 80px);object-fit:contain;border-radius:var(--radius);user-select:none}
.ls{position:fixed;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.1);color:#fff;width:42px;height:42px;border-radius:50%;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;border:none}
.ls:hover{background:rgba(255,255,255,.2)}#lp{left:8px}#ln{right:8px}
#lc{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;padding:5px 14px;border-radius:20px;font-size:12px;white-space:nowrap;max-width:85vw;overflow:hidden;text-overflow:ellipsis}
#lx{position:fixed;top:12px;right:12px;background:rgba(255,255,255,.1);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#lx:hover{background:rgba(255,255,255,.2)}
@media(max-width:600px){:root{--rh:150px}#g{gap:2px;padding:2px}}
</style></head><body>
<header><h1>Photo<span>Board</span> — ${folder}</h1><span class="cnt" id="xcnt">${thumbs.length} photos</span>
<input type="range" id="sz" min="80" max="400" value="220" title="Row height"/></header>
${hasGalleries?tabsHTML:''}
<div id="g">${cards}</div>
<div id="lb"><button id="lx">✕</button><button class="ls" id="lp">‹</button><img id="li" src="" alt=""/><button class="ls" id="ln">›</button><div id="lc"></div></div>
<script>
const cards=[...document.querySelectorAll('.pc')];let idx=0;
cards.forEach(c=>{const i=c.querySelector('img');i.onload=()=>i.classList.add('ld');i.classList.add('ld');});
function vis(){return cards.filter(c=>c.style.display!=='none');}
function show(){const vc=vis(),c=vc[idx];document.getElementById('li').src=c.querySelector('img').src;document.getElementById('lc').textContent=(idx+1)+' / '+vc.length;document.getElementById('lb').classList.add('open');}
function close(){document.getElementById('lb').classList.remove('open');}
cards.forEach(c=>{c.addEventListener('click',()=>{const vc=vis();idx=vc.indexOf(c);if(idx>=0)show();});});
document.getElementById('lx').addEventListener('click',close);
document.getElementById('lb').addEventListener('click',e=>{if(e.target===document.getElementById('lb'))close();});
document.getElementById('lp').addEventListener('click',()=>{const vc=vis();idx=(idx-1+vc.length)%vc.length;show();});
document.getElementById('ln').addEventListener('click',()=>{const vc=vis();idx=(idx+1)%vc.length;show();});
document.addEventListener('keydown',e=>{if(!document.getElementById('lb').classList.contains('open'))return;if(e.key==='Escape')close();const vc=vis();if(e.key==='ArrowLeft'){idx=(idx-1+vc.length)%vc.length;show();}if(e.key==='ArrowRight'){idx=(idx+1)%vc.length;show();}});
let tx=0;document.getElementById('lb').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.getElementById('lb').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx,vc=vis();if(Math.abs(d)>50){idx=d<0?(idx+1)%vc.length:(idx-1+vc.length)%vc.length;show();}},{passive:true});
document.getElementById('sz').addEventListener('input',e=>{document.documentElement.style.setProperty('--rh',e.target.value+'px');});
document.querySelectorAll('.tab').forEach(tab=>{tab.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));tab.classList.add('active');const g=tab.dataset.g;cards.forEach(c=>{c.style.display=(g==='all'||c.dataset.gallery===g)?'':'none';});document.getElementById('xcnt').textContent=vis().length+' photos';});});
<\/script></body></html>`;
}
</script>
</body>
</html>
